name: 每日文献更新 | Daily literature update
on:
  schedule:
    # Singapore/Beijing 08:17 = UTC 00:17, every day
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: biocatalyst-literature
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch OpenAlex and Crossref metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python scripts/update_literature.py
      - name: Commit refreshed database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily literature metadata update'
            git push
          fi