name: One-time OA full-text backfill
on:
  push:
    paths:
      - '.github/workflows/fulltext-backfill.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: biocatalyst-literature
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Run legal OA full-text extraction
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/enrich_fulltext.py --limit 7 --force
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_fulltext.py' -v
      - name: Commit evidence candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/papers.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: legal OA evidence candidates with source locators'
            git push
          fi
