function kindReview(p){return /review|综述/i.test([p.kind,p.title].join(' '))}
function directionPapers(d){return allPapers().filter(p=>(p.directions||[]).includes(d))}
function subMatches(p,t){if(t.onlyReview)return kindReview(p);let prose=[p.title,p.abstract].join(' ').toLowerCase();return (t.rx||[]).some(r=>(p.reactions||[]).includes(r))||(t.terms||[]).some(term=>prose.includes(term));}

function assessScope(p){
 const title=(p.title||'').toLowerCase(), body=(title+' '+(p.abstract||'')).toLowerCase();
 const test=(r,s=body)=>r.test(s);

async function translatePublicEnglish(text){
 // A user-initiated request to a public translation service; do not claim translation if absent.
 const chunks=[]; let x=String(text||'').slice(0,1850);
 while(x.length){let n=Math.min(400,x.length), j=n;if(x.length>n){let cut=Math.max(x.lastIndexOf('. ',n),x.lastIndexOf('; ',n));if(cut>n*0.55)j=cut+2;}chunks.push(x.slice(0,j));x=x.slice(j).trim();}
 let out=[];for(let phrase of chunks){let url='https://api.mymemory.translated.net/get?'+new URLSearchParams({q:phrase,langpair:'en|zh-CN'});let response=await fetch(url,{mode:'cors'});if(!response.ok)throw Error('HTTP '+response.status);let v=await response.json();let t=v.responseData?.translatedText||'';if(v.responseStatus!==200||!/[\u4e00-\u9fff]/.test(t)||t.toLowerCase()===phrase.toLowerCase())throw Error('翻译接口暂不可用');out.push(t);}
 return out.join('\n');
}

function parseCSV(s){let lines=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))lines.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))lines.push(row);let [h,...items]=lines;return h?items.map(r=>Object.fromEntries(h.map((key,i)=>[key.replace(/^\ufeff/,''),r[i]||'']))):[]}
async function importFile(file){let s=await file.text();try{let data;if(file.name.toLowerCase().endsWith('.csv')){let rows=parseCSV(s);let docs=rows.filter(r=>r.title).map(r=>normalizeManual(r));local.manualPapers.push(...docs);toast('已导入 '+docs.length+' 条 CSV 文献，按标题/DOI 去重显示')}else{data=JSON.parse(s);if(data.local){if(!confirm('导入备份将覆盖本机当前阅读笔记与实验数据，继续吗？'))return;local={...JSON.parse(JSON.stringify(initial)),...data.local}}else if(data.papers){local.manualPapers.push(...data.papers.filter(p=>p&&p.title).map(normalizeManual));toast('已导入 '+data.papers.length+' 条文献')}else if(Array.isArray(data)){local.manualPapers.push(...data.filter(p=>p.title).map(normalizeManual));toast('文献数据已导入')}else throw Error('JSON 不含 local 或 papers 数组')}save();render()}catch(e){toast('导入失败：'+e.message)}}
function normalizeManual(x){let doi=(x.doi||'').trim().toLowerCase().replace(/^https?:\/\/doi.org\//,'');let dirs=Array.isArray(x.directions)?x.directions:((x.directions||x.direction||'').split(/[;,；、]/).map(v=>v.trim()).filter(Boolean));return {...x,doi,id:doi?'doi:'+doi:'local:'+Date.now()+'-'+Math.random().toString(16).slice(2,9),directions:dirs,reactions:Array.isArray(x.reactions)?x.reactions:((x.reactions||'').split(/[;,；、]/).filter(Boolean)),feedstocks:Array.isArray(x.feedstocks)?x.feedstocks:((x.feedstocks||'').split(/[;,；、]/).filter(Boolean)),authors:Array.isArray(x.authors)?x.authors:[],materials:Array.isArray(x.materials)?x.materials:[],kind:x.kind||'article',sources:['人工录入'],first_seen_at:new Date().toISOString(),date:x.date||'',journal:x.journal||'',abstract:x.abstract||'',url:doi?doiLink(doi):'',evidence_status:'个人手动录入，未经系统核验'}}
async function sync(silent=false){if(location.protocol==='file:'){toast('本地文件不能后台更新；请按部署说明启用 GitHub Pages。');return}try{let r=await fetch('data/papers.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(!Array.isArray(d.papers))throw Error('无效文献数据文件');let changed=remote.last_success!==d.last_success;remote=d;render();if(!silent)toast('站点文献快照已同步，最新成功抓取：'+clock(d.last_success));else if(changed&&d.last_success)toast('每日文献数据库已自动同步到最新快照')}catch(e){if(!silent)toast('站点文献数据加载失败：'+e.message)}}

// V2.4 independent condition-first discovery. Rows always preserve experiment → catalyst → product identifiers.
let condQ='',condDir='',condReactor='',condTemp='',condEnergy='',condPressure='',condMode='';
function condSpecimen(r){return matrixSpecimen(r.specimenId)}
function condDirection(r){return condSpecimen(r)?.direction||'未分类'}
function condReactorType(r){let t=String(r.reactor||'').toLowerCase();if(/dbd|介质阻挡|等离子/.test(t))return 'DBD/等离子体';if(/固定床|fixed.bed/.test(t))return '固定床';if(/batch|间歇|高压釜|反应釜/.test(t))return '间歇釜';if(/流化床|fluidized/.test(t))return '流化床';return t?'其他反应器':'未报告'}
function condEnergyType(r){let txt=[r.energyInput||'',r.plasmaPower||'',r.voltage||''].join(' ').toLowerCase(),direction=condDirection(r);if(direction==='低温等离子体'||/dbd|plasma|放电/.test(txt))return '等离子体';if(direction==='电催化')return '电化学';if(direction==='光催化')return '光能';return '热催化/其他'}
function condHeatString(r){let input=String(r.energyInput||'').trim();if(input)return input;if(String(r.plasmaPower||'').trim())return r.plasmaPower+' W（等离子体功率）';return '未报告'}
function condFlux(r){let a=[];if(String(r.feedRate||'').trim())a.push(`${r.feed||'原料'}：${r.feedRate} cm³/min`);if(String(r.ch4Flow||'').trim())a.push(`CH₄：${r.ch4Flow} cm³/min`);if(String(r.h2Flow||'').trim())a.push(`H₂：${r.h2Flow} cm³/min`);if(String(r.n2Flow||'').trim())a.push(`N₂：${r.n2Flow} cm³/min`);return a.length?a.join('；'):'未报告'}
function condTempNumber(r){let match=String(r.temperature||'').match(/-?\d+(?:\.\d+)?/);return match?Number(match[0]):null}
function condPressureType(r){let txt=String(r.pressure||'').toLowerCase();if(!txt)return '未报告';if(/常压|大气|ambient|atm/.test(txt))return '常压';if(/高压|mpa|bar|psi/.test(txt))return '数值压力/加压';return '其他/未定'}
function condRows(){return matrixAll('runs').filter(r=>{
 let s=condSpecimen(r),hay=JSON.stringify([r,s]).toLowerCase();if(condQ&&!matrixTokens(condQ.toLowerCase()).some(token=>hay.includes(token)))return false;
 if(condDir&&condDirection(r)!==condDir)return false;
 if(condReactor&&condReactorType(r)!==condReactor)return false;
 if(condEnergy&&condEnergyType(r)!==condEnergy)return false;
 if(condPressure&&condPressureType(r)!==condPressure)return false;
 if(condMode){let continuous=/连续|continuous|流动/.test(r.mode||'');let batch=/间歇|batch/.test(r.mode||'');if(condMode==='连续'&&!continuous)return false;if(condMode==='间歇'&&!batch)return false}
 if(condTemp){let t=condTempNumber(r);if(t===null)return condTemp==='unknown';if(condTemp==='unknown')return false;if(condTemp==='le150'&&t>150)return false;if(condTemp==='150-300'&&(t<=150||t>300))return false;if(condTemp==='300-400'&&(t<=300||t>400))return false;if(condTemp==='gt400'&&t<=400)return false}
 return true;
})}
function condValue(v){return String(v??'').trim()&&String(v).trim()!=='—'?esc(v):'<span class="matrix-missing">未报告</span>'}
function condRunCell(r){let s=condSpecimen(r);return `<button class="matrix-action condition-primary" data-matrix-detail="runs:${attr(r.id)}">${esc(r.reaction||r.id)} ↗</button><div class="condition-micro">${esc(s?.name||'未绑定催化剂')} · ${esc(condDirection(r))}</div><div class="condition-evidence">${esc(r.review||'待核验')}${r.sourceType==='截图示例'?' · 截图示例':''}</div>`}
function conditionTable(){let rows=condRows();let body=rows.map(r=>{let s=condSpecimen(r);return `<tr>
<td>${condRunCell(r)}</td><td>${condValue(r.reactor)}</td><td>${condValue(r.catalystMass)}${r.catalystMass?'<span class="condition-unit"> g</span>':''}</td>
<td>${condValue(condFlux(r))}</td><td><span class="condition-metric">${condValue(r.temperature)}</span>${r.temperature?'<span class="condition-unit"> °C</span>':''}</td>
<td>${condValue(r.pressure)}</td><td><span class="condition-metric">${condValue(condHeatString(r))}</span><div class="condition-micro">${esc(condEnergyType(r))}</div></td>
<td>${condValue(r.mode)}</td><td>${condValue(r.feed)}<div class="condition-micro">${condValue(r.feedOrigin)}</div></td>
<td>${s?`<button class="matrix-action" data-matrix-detail="specimens:${attr(s.id)}">${esc(s.name)} ↗</button>`:'未关联'}</td>
<td><button class="btn sm" data-matrix-detail="runs:${attr(r.id)}">全部条件 / 证据</button><div class="condition-micro">${matrixSourceLink(r)}</div></td></tr>`}).join('');return `<div class="matrix-table-shell"><div class="matrix-scroll"><table class="matrix-table condition-table" data-conditions-table><thead><tr>${['反应类型 / 实验编号','反应器类型','催化剂用量','原料及气体流速','反应温度','反应压力','功率 / 能量输入','反应模式','原料及来源','关联催化剂','原文证据 / 操作'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body||'<tr><td colspan="11"><div class="matrix-empty">没有匹配的已录入实验。可放宽筛选或录入经核验的新工况；不代表该方向不存在论文。</div></td></tr>'}</tbody></table></div></div><div class="condition-tip">当前 ${rows.length} / ${matrixAll('runs').length} 条实验 · 横向滚动查看更多条件 · 温度筛选按记录中的名义温度分类，± 波动范围仍保留原文写法。功率（W）与单位产物能耗（kWh/kg）不可直接比较。</div>`}
function conditionsView(){let reactors=[...new Set(matrixAll('runs').map(condReactorType))].sort();return heading('按反应条件查','先按反应器、温度、压力、能量输入和运行方式筛选，再一键追踪催化剂及原文证据',`<button class="btn sm primary" data-condition-add>＋ 录入反应条件</button>`)+`<div class="matrix-intro"><b>一行 = 一组独立实验工况。</b> 默认直接展示：反应器类型、催化剂用量、原料/气体流速、反应温度、反应压力、功率/能量输入、反应模式。<div class="small muted" style="margin-top:7px"><b>示例：</b>Ir/GaN：DBD 石英管反应器 · 催化剂 0.1 g · 热解油 0.05 cm³/min · CH₄ 100 cm³/min · 约 100 ± 5 ℃ · 常压 · 12 W · 连续逆流。该条来自你提供的截图，仍标记「待全文核验」。</div></div>

<div class="condition-actions"><div class="split"><span class="condition-tag" id="conditionCount">${condRows().length} 组匹配工况</span><button class="btn sm" data-condition-reset>清空筛选</button></div><div class="split"><button class="btn sm" data-condition-csv>↓ 导出当前工况 CSV</button><button class="btn sm" data-condition-matrix>进入三表联动 ↗</button></div></div><div id="condition-results">${conditionTable()}</div>`}

function matrixSubmit(e){if(e.target.id!=='matrixAddForm')return false;e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));let kind=f.dataset.kind;let doi=matrixDOI(v.doi);if(v.sourceType==='论文摘录'&&!doi){toast('论文摘录必须填写 DOI，方便溯源和去重');return true}if(!v.anchor?.trim()){toast('必须填写原文图、表、页码或实验记录位置');return true}if(kind==='products'&&Object.entries(v).some(([k,val])=>['liquidYield','gasoline','diesel','heavy','jet','hdo','hdn'].includes(k)&&val.trim())&&!v.selectivityBasis?.trim()){toast('填写产率/脱氧率/选择性时，必须注明定量基准');return true}if(v.review==='已核验'&&v.sourceType==='截图待核验'){toast('截图来源应先核对原始论文后才能标记已核验');return true}if(!local.matrix)local.matrix={specimens:[],runs:[],products:[]};if(!local.matrix[kind])local.matrix[kind]=[];v.id=f.dataset.editid||('USR-'+Date.now()+'-'+Math.random().toString(36).slice(2,6));v.doi=doi;v.createdAt=new Date().toISOString();let returnToConditions=page==='conditions'&&kind==='runs';let oldIndex=local.matrix[kind].findIndex(x=>x.id===v.id);if(oldIndex>=0)local.matrix[kind][oldIndex]=v;else local.matrix[kind].push(v);save();closeModal();matrixTab=kind;navigate(returnToConditions?'conditions':'matrix');toast('已保存至个人科研实证数据库');return true}
async function matrixImportCSV(file){try{let src=await file.text(),rows=parseCSV(src),kind=matrixTab,expected=MATRIX_FIELDS[kind].map(x=>x[0]);if(!rows.length){toast('CSV 没有记录');return}let headers=Object.keys(rows[0]);if(!headers.includes('anchor')||!headers.includes(expected[0])){toast('表头不匹配：请从对应表先导出 CSV 模板');return}if(!local.matrix)local.matrix={specimens:[],runs:[],products:[]};let store=local.matrix[kind]=local.matrix[kind]||[],ids=new Set([...MATRIX_SEED[kind],...store].map(x=>x.id)),added=0,skipped=0;for(let r of rows){if(!r.anchor?.trim()){skipped++;continue}if(kind==='runs'&&!matrixSpecimen(r.specimenId)){skipped++;continue}if(kind==='products'&&!matrixRun(r.runId)){skipped++;continue}let id=r.id||'USR-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);if(ids.has(id)){skipped++;continue}if(r.sourceType==='论文摘录'&&!matrixDOI(r.doi)){skipped++;continue}let vals={};for(let k of [...expected,'sourceType','review','notes'])vals[k]=r[k]||'';vals.id=id;vals.doi=matrixDOI(vals.doi);vals.sourceType=vals.sourceType||'CSV 人工导入';vals.review=vals.review||'待核验';store.push(vals);ids.add(id);added++}save();render();toast('CSV 导入 '+added+' 条，跳过重复/缺失关联或证据 '+skipped+' 条')}catch(e){toast('CSV 导入出错：'+e.message)}}
function matrixExportCSV(){let rows=matrixRows(),keys=MATRIX_FIELDS[matrixTab].map(x=>x[0]);let columns=['id',...keys.filter(x=>x!=='id'),'sourceType','notes'];download('BioCatalyst_'+matrixTab+'_'+todayLocal()+'.csv',csv(rows,columns),'text/csv;charset=utf-8');toast('当前筛选的数据已导出')}
function matrixMarkdown(mode='all'){let selectedId=mode.includes(':')?mode.split(':').slice(1).join(':'):'';let selectedKind=mode.includes(':')?mode.split(':')[0]:'';let selectedSample=selectedId?(selectedKind==='specimens'?selectedId:selectedKind==='runs'?matrixRun(selectedId)?.specimenId:matrixRun(matrixAll('products').find(x=>x.id===selectedId)?.runId)?.specimenId):matrixScope;let rows=Object.keys(MATRIX_LABELS).map(k=>{let arr=matrixAll(k).filter(x=>!selectedSample||(k==='specimens'?x.id===selectedSample:k==='runs'?x.specimenId===selectedSample:matrixRun(x.runId)?.specimenId===selectedSample));let cols=MATRIX_FIELDS[k];let escapeMD=x=>String(x??'').replace(/\|/g,'\\|').replace(/\n/g,' ');return `## ${MATRIX_LABELS[k]}\n\n| ${cols.map(x=>x[1]+(x[2]?` (${x[2]})`:'' )).join(' | ')} |\n| ${cols.map(()=>'-').join(' | ')} |\n${arr.map(r=>'| '+cols.map(([key])=>escapeMD(r[key]||'未报告')).join(' | ')+' |').join('\n')}\n`}).join('\n');return `---\ntags: [BioCatalyst, catalyst-upgrading, evidence] \ncreated: ${todayLocal()}\nsource: BioCatalyst Intelligence 2.4\n---\n\n# 生物油催化提质 · 文献实证摘录\n\n> [!warning] 核验声明\n> 截图演示数据未与原始文献核验；未报告字段不得推断或补填。产物百分比的分母须参阅原文。\n\n${rows}\n`}
function matrixDownloadMD(mode){let content=matrixMarkdown(mode);download('BioCatalyst_文献实证摘录_'+todayLocal()+'.md',content,'text/markdown;charset=utf-8');toast('已生成 Obsidian 可用 Markdown；建议放入文献笔记并核对来源')}
function matrixClick(btn){if(btn.hasAttribute('data-matrix-tab')){matrixTab=btn.dataset.matrixTab;matrixQuery='';matrixScope='';render();return true}if(btn.hasAttribute('data-matrix-edit')){let [k,...id]=btn.dataset.matrixEdit.split(':');closeModal();matrixAdd(k,id.join(':'));return true}if(btn.hasAttribute('data-matrix-del')){let [k,...id]=btn.dataset.matrixDel.split(':');let rid=id.join(':');if(k==='specimens'&&matrixAll('runs').some(x=>x.specimenId===rid)){toast('该样品仍关联反应工况，请先处理关联记录');return true}if(k==='runs'&&matrixAll('products').some(x=>x.runId===rid)){toast('该反应仍关联产物数据，请先处理关联记录');return true}if(confirm('确认删除这条个人实证记录？')){local.matrix[k]=local.matrix[k].filter(x=>x.id!==rid);save();closeModal();render();toast('记录已删除')}return true}if(btn.hasAttribute('data-matrix-mode')){matrixMode=btn.dataset.matrixMode;render();return true}if(btn.hasAttribute('data-matrix-add')){matrixAdd(btn.dataset.matrixAdd);return true}if(btn.hasAttribute('data-matrix-detail')){let [tab,...id]=btn.dataset.matrixDetail.split(':');matrixDetail(tab,id.join(':'));return true}if(btn.hasAttribute('data-matrix-jump')){closeModal();matrixJump(btn.dataset.matrixJump);return true}if(btn.hasAttribute('data-matrix-csv')){matrixExportCSV();return true}if(btn.hasAttribute('data-matrix-import')){document.getElementById('matrixCsvInput')?.click();return true}if(btn.hasAttribute('data-matrix-md')){matrixDownloadMD(btn.dataset.matrixMd);return true}if(btn.hasAttribute('data-matrix-related')){closeModal();matrixQuery=btn.dataset.matrixRelated;matrixScope='';navigate('matrix');return true}if(btn.hasAttribute('data-matrix-reset')){matrixScope='';matrixQuery='';render();return true}return false}
